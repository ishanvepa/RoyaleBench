schema_version = "1.4"
artifacts = [
    { source = "/var/lib/royale", destination = "royale" },
]

[task]
name = "royalebench/coordinates-01-immediate-lethal"
description = "Recognize immediate lethal. Win after your first decision. You may submit only one decision; the remaining six-second window runs automatically. | action_mode=coordinates-v1 | version=1.0.0-coordinate.1"

[metadata]
category = "clash-royale-continuation"
difficulty = "easy"
opponent = "planner"
deck = "giant-beatdown"
seed = 101
seat = "blue"
decision_ticks = 40
dataset_version = "1.0.0-coordinate.1"
family = 1
opponent_deck = "xbow-cycle"
control = true
action_mode = "coordinates-v1"

[agent]
network_mode = "allowlist"
allowed_hosts = [
    "api.anthropic.com",
    "api.openai.com",
    "openrouter.ai",
]
timeout_sec = 3600.0
user = "player"

[verifier]
network_mode = "no-network"
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[environment.healthcheck]
command = "runuser -u referee -- /usr/local/sbin/royale-start-server"
timeout_sec = 60
start_period_sec = 0
retries = 3
