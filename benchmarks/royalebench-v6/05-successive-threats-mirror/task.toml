schema_version = "1.4"
artifacts = [
    { source = "/var/lib/royale", destination = "royale" },
]

[task]
name = "royalebench/v4-05-successive-threats-mirror"
description = "Budget across successive threats (opposite lane). Keep both princess towers alive for 20 seconds, take at most 450 total tower damage, and spend at most 8 elixir. At elapsed 6.0s the opponent casts its reserved GoblinBarrel on your right tower (14.5, 6.5). | action_mode=coordinates-v1 | version=4.0.0"

[metadata]
category = "clash-royale-continuation"
difficulty = "hard"
opponent = "planner"
deck = "hog-2.6-cycle"
seed = 105
seat = "blue"
decision_ticks = 40
dataset_version = "4.0.0"
family = 5
opponent_deck = "log-bait"
control = false
action_mode = "coordinates-v1"

[agent]
network_mode = "allowlist"
allowed_hosts = [
    "api.anthropic.com",
    "api.openai.com",
    "openrouter.ai",
    "ishanvepa171--ep-qwen3-8-2-4t-a95b-server.us-west.modal.direct",
    "ishanvepa171--ep-inkling-2-small-server.us-west.modal.direct",
    "ishanvepa171--ep-deepseek-v4-1-flash-1017-server.us-west.modal.direct",
    "ishanvepa171--ep-kimi-k3-1-pro-server.us-west.modal.direct",
]
timeout_sec = 3600.0
user = "player"

[verifier]
network_mode = "no-network"
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[environment.healthcheck]
command = "runuser -u referee -- /usr/local/sbin/royale-start-server"
timeout_sec = 60
start_period_sec = 0
retries = 3
