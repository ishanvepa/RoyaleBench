# The reference search ("Stockfish") bot against the Claude models. The bot is free; the models are
# called through the logged-in Claude Code CLI, so this job spends model usage.
#   uv run python -m cr_arena.tournament --config configs/search_bot.toml --job search-vs-llms --dry-run
#   uv run python -m cr_arena.tournament --config configs/search_bot.toml --job search-vs-llms
# Only the bot's games against one model:  --players search-bot,claude-haiku-5.5
[tournament]
out_dir = "runs/round_robin"
seeds = [1, 2]
decision_ticks = 40
parallel = 8
replays_per_pair = 3
anchor = "search-bot"      # ratings are pinned to the bot (400), so each model reads as +/- Elo against it

[decks]
classic = ["giant-beatdown", "hog-2.6-cycle", "lavaloon"]

# The one reference bot. Strength knobs: rollouts per move and look-ahead horizon.
[[players]]
name = "search-bot"
type = "search"
rollouts = 4
horizon_s = 12.0

[[players]]
name = "claude-fable-5.1"
provider = "claude_cli"
model = "claude-fable-5-1"
effort = "low"
timeout_s = 150

[[players]]
name = "claude-opus-5.5"
provider = "claude_cli"
model = "claude-opus-5-5"
effort = "low"
timeout_s = 150

[[players]]
name = "claude-sonnet-5.5"
provider = "claude_cli"
model = "claude-sonnet-5-5"
effort = "low"
timeout_s = 150

[[players]]
name = "claude-haiku-5.5"
provider = "claude_cli"
model = "claude-haiku-5-5"
effort = "low"
timeout_s = 150

[[players]]
name = "claude-opus-4.8"
provider = "claude_cli"
model = "claude-opus-4-8"
effort = "low"
timeout_s = 150
