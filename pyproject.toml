[project]
name = "cr-arena"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "python-dotenv>=1.2.4",
    "psycopg[binary]>=3.2,<4",
    "royalegym[all]>=0.1.28",
    "tomli-w>=1.2.0",
    "valkyrie-sdk>=0.36,<1",
    "fastapi>=0.163.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
hosting = [
    "modal>=1.6,<2",
]

# The public CPU game does not need the benchmark's model SDKs or training stack.
[dependency-groups]
play = [
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "royalegym>=0.1.28",
    "royalesim>=0.1.48",
    "starlette>=1.10,<2",
    "uvicorn[standard]>=0.54.0",
]
