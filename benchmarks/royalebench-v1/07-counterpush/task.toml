schema_version = "1.4"
artifacts = [{ source = "/var/lib/royale", destination = "royale" }]

[task]
name = "royalebench/07-counterpush"
description = "Convert defense into offense. Win the continuation before the match ends (35 seconds of regulation plus up to 120 seconds of overtime). | opponent=planner-bot | seed=107 | version=1.0.0"

[metadata]
category = "clash-royale-continuation"
difficulty = "hard"
opponent = "planner"
deck = "giant-beatdown"
seed = 107
seat = "blue"
decision_ticks = 40

dataset_version = "1.0.0"
family = 7
opponent_deck = "pekka-bridge-spam"
control = false

[agent]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "openrouter.ai", "ishanvepa171--ep-qwen3-8-2-4t-a95b-server.us-west.modal.direct", "ishanvepa171--ep-inkling-2-small-server.us-west.modal.direct"]
timeout_sec = 3600.0
user = "player"

[verifier]
network_mode = "no-network"
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[environment.healthcheck]
command = "runuser -u referee -- /usr/local/sbin/royale-start-server"
timeout_sec = 60
start_period_sec = 0
retries = 3
