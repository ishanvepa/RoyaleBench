schema_version = "1.4"
artifacts = [{ source = "/var/lib/royale", destination = "royale" }]

[task]
name = "royalebench/03-spell-placement"
description = "Compare spell placements. Cast exactly one Fireball, keep both princess towers alive for 12 seconds, and take at most 150 total tower damage. Only Fireball and waiting are available. | opponent=planner-bot | seed=103 | version=1.0.0"

[metadata]
category = "clash-royale-continuation"
difficulty = "easy"
opponent = "planner"
deck = "xbow-cycle"
seed = 103
seat = "blue"
decision_ticks = 40

dataset_version = "1.0.0"
family = 3
opponent_deck = "lavaloon"
control = false

[agent]
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com", "api.openai.com", "openrouter.ai", "ishanvepa171--ep-qwen3-8-2-4t-a95b-server.us-west.modal.direct", "ishanvepa171--ep-inkling-2-small-server.us-west.modal.direct"]
timeout_sec = 3600.0
user = "player"

[verifier]
network_mode = "no-network"
timeout_sec = 600.0
environment_mode = "separate"

[environment]
network_mode = "public"
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
workdir = "/app"

[environment.healthcheck]
command = "runuser -u referee -- /usr/local/sbin/royale-start-server"
timeout_sec = 60
start_period_sec = 0
retries = 3
