<style>
:root { color-scheme:dark; --blue:#78b5ff; --red:#f58d79; --ink:#e8edf7; --muted:#a5b2c9;
  --bg:#0e1420; --surface:#172033; --panel:#1f2b44; --line:#354563; --elixir:#e18deb; }
* { box-sizing: border-box; }
body { margin:0; font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink); background:var(--bg); }
header { display:flex; align-items:baseline; gap:12px; padding:8px 14px; background:var(--surface);
  border-bottom:1px solid var(--line); flex-wrap:wrap; }
header h1 { font-size:15px; margin:0; }
header .meta { color:var(--muted); font-size:12px; }
#warn { display:none; background:#342b19; color:#f3d28a; border-bottom:1px solid #725b2d;
  padding:6px 14px; }
main { display:flex; gap:12px; padding:10px 14px; align-items:flex-start; }
.team-panels { width:190px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; }
.side { width:190px; background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:10px; }
.side h2 { margin:0 0 6px; font-size:14px; display:flex; justify-content:space-between; }
.side.blue h2 { color:var(--blue); } .side.red h2 { color:var(--red); }
.bar { height:10px; background:var(--panel); border-radius:5px; overflow:hidden; margin:3px 0 8px; }
.bar > div { height:100%; background:#c44fd6; }
.hand { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:3px 5px;
  font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card b { float:right; color:var(--elixir); }
.kv { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; }
.kv span:last-child { color:var(--ink); font-variant-numeric:tabular-nums; }
#boardwrap { flex:1 1 360px; min-width:260px; display:flex; flex-direction:column;
  align-items:center; }
canvas { background:#7fb35b; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.25);
  touch-action:none; }
#controls { display:flex; gap:8px; align-items:center; width:100%; max-width:760px;
  margin-top:8px; flex-wrap:wrap; }
#controls button, #speed { font:inherit; color:var(--ink); padding:4px 10px;
  border:1px solid var(--line); background:var(--surface); border-radius:5px; cursor:pointer; }
#controls button { min-width:34px; }
#controls button:hover, #speed:hover { background:var(--panel); }
#controls :focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
#controls input { accent-color:var(--blue); }
#scrub { flex:1 1 240px; cursor:pointer; }
#clock { font-variant-numeric:tabular-nums; min-width:150px; text-align:right; }
#result { margin-top:6px; font-weight:600; min-height:18px; }
#tip { position:fixed; pointer-events:none; background:rgba(14,20,32,.96); color:var(--ink);
  padding:5px 7px; border:1px solid var(--line); border-radius:5px; font-size:12px; display:none; white-space:pre;
  z-index:5; }
footer { color:var(--muted); font-size:11px; padding:4px 14px 12px; }
.legend { display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color:var(--muted);
  margin-top:6px; }
.sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:3px;
  vertical-align:-1px; }
.decision-panel { width:300px; flex-shrink:0; min-width:0; padding:12px; border:1px solid var(--line);
  border-radius:8px; background:var(--surface); }
.decision-panel h2 { margin:0 0 6px; font-size:14px; }
.decision-panel .note { color:var(--muted); font-size:11px; margin:0 0 12px; }
#decision-body { max-height:calc(100vh - 150px); overflow:auto; overflow-wrap:anywhere; }
.decision-panel h3 { font-size:12px; margin:0 0 10px; color:var(--blue); }
.decision-panel h3.red { color:var(--red); }
.decision-step + .decision-step { margin-top:10px; }
.decision-step .kind { display:block; color:var(--muted); font-size:11px; margin-bottom:4px; }
.decision-panel pre { font:12px/1.5 ui-monospace,"SF Mono",Consolas,monospace; white-space:pre-wrap;
  overflow-wrap:anywhere; margin:0; }
.decision-step pre { padding:8px; background:var(--bg); border-radius:5px; }
.decision-panel summary { cursor:pointer; color:var(--muted); font-size:12px; padding:4px 0; }
.decision-panel :focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
.decision-history { margin-top:14px; border-top:1px solid var(--line); padding-top:8px; }
.decision-history article { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
.decision-count { color:var(--muted); font-size:11px; margin:0 0 10px; }
@media (max-width:1100px) {
  .team-panels, .side { width:150px; }
  .decision-panel { width:260px; }
}
@media (max-width:850px) {
  main { flex-wrap:wrap; }
  .team-panels { order:1; width:100%; flex-direction:row; }
  .side { flex:1; }
  #boardwrap { flex:1 1 260px; }
  .decision-panel { flex:1 1 240px; }
}
@media (max-width:700px) {
  main { flex-direction:column; align-items:center; padding:8px; }
  #boardwrap { order:-1; flex:0 0 auto; min-width:0; width:100%; }
  .team-panels { flex-direction:column; }
  .side { width:100%; }
  .decision-panel { width:100%; flex:0 0 auto; }
  #decision-body { max-height:420px; }
}
</style>

      if (ctx.roundRect) {
        ctx.beginPath();
        ctx.roundRect(lx - tw / 2 - 7, ly - lh / 2, tw + 14, lh, lh / 2);
        ctx.fill();
      } else ctx.fillRect(lx - tw / 2 - 7, ly - lh / 2, tw + 14, lh);
      ctx.fillStyle = "#fff";
      ctx.fillText(label, lx, ly);
    },
  });
  window.BattleRenderer = Object.freeze({
    placement,
    create,
    iconOf,
    pretty,
    lerp,
    colors: C,
  });
})();

</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("replay-data").textContent);
  var A = D.arena, S = A.subtile, TX = A.tiles_x, TY = A.tiles_y;
    var EF = {}, FF = {}, SF = {};
  D.entity_fields.forEach(function (n, i) { EF[n] = i; });
  D.frame_fields.forEach(function (n, i) { FF[n] = i; });
  (D.spell_fields || []).forEach(function (n, i) { SF[n] = i; });
  var MOTION = D.motions || {};
  var FR = D.frames, N = FR.length, TICK_MS = D.source.tick_ms;
  var KIND = D.kinds, CARDS = D.cards;
  var C = BattleRenderer.colors, TEAM = [C.blue, C.red], TEAM_DARK = [C.blueDk, C.redDk];
  var NAMES = ["Blue", "Red"];
  var cv = document.getElementById("board"), ctx = cv.getContext("2d");
  var scrub = document.getElementById("scrub"), playBtn = document.getElementById("play");
  var speedSel = document.getElementById("speed"), flipBox = document.getElementById("flip");
  var interpBox = document.getElementById("interp"), tip = document.getElementById("tip");
  var cur = 0, playing = false, simTick = FR[0][FF.tick], lastT = null;
  var scale = 20, drawn = [];
  var renderer = BattleRenderer.create(cv, A);
  var cards = Object.fromEntries(CARDS.map(function (c) { return [c.card_id, [c.name, c.card_kind, c.elixir]]; }));
  var motionNames = Object.fromEntries(Object.entries(MOTION).map(function (entry) { return [entry[1], entry[0]]; }));
  var UNIT_TYPES = D.unit_types || [];
  var PF = {};
  (D.projectile_fields || []).forEach(function (n, i) { PF[n] = i; });
  var snapshots = new Map(), observed = -1;
  function snapshot(i) {
    if (snapshots.has(i)) return snapshots.get(i);
    var f = FR[i];
    var s = {k: tick(i), en: f[FF.entities].map(function (r) {
      var facing = EF.facing === undefined ? [0, 0] : r[EF.facing];
      return [r[EF.uid], r[EF.team], r[EF.kind], r[EF.card_id], r[EF.x] / S, r[EF.y] / S,
        r[EF.hp], r[EF.max_hp], r[EF.radius] / S, (r[EF.flying] ? 1 : 0) | (r[EF.deploy_ticks] > 0 ? 2 : 0),
        r[EF.tower_slot], facing[0], facing[1], EF.stun_ticks === undefined ? 0 : r[EF.stun_ticks],
        EF.footprint === undefined || !r[EF.footprint] ? null : r[EF.footprint].map(function (v) { return v / S; }),
        EF.shield === undefined ? 0 : r[EF.shield], EF.status_flags === undefined ? -1 : r[EF.status_flags],
        EF.charge === undefined ? -1 : r[EF.charge],
        EF.unit_type === undefined ? null : UNIT_TYPES[r[EF.unit_type]] || null];
    }), sp: (FF.spells === undefined ? [] : f[FF.spells] || []).map(function (q) {
      return [q[SF.team], q[SF.card_id], q[SF.x] / S, q[SF.y] / S, q[SF.aim_x] / S,
        q[SF.aim_y] / S, motionNames[q[SF.motion]]];
    }), pr: (FF.projectiles === undefined || PF.x === undefined ? [] : f[FF.projectiles] || []).map(function (p) {
      return [p[PF.team], p[PF.x] / S, p[PF.y] / S];
    })};
    snapshots.set(i, s);
    if (snapshots.size > 4) snapshots.delete(snapshots.keys().next().value);
    return s;
  }
  scrub.max = String(N - 1);

  function tick(i) { return FR[i][FF.tick]; }
  var cardById = new Map(CARDS.map(function (c) { return [c.card_id, c]; }));
  function cardName(id) { return cardById.get(id)?.name || ""; }
  function fmtTime(t) {
    var ms = t * TICK_MS, s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + "." +
      String(Math.floor((ms % 1000) / 100));
  }
  function px(x, y) {
    var tx = x / S, ty = y / S;
    if (flipBox.checked) { tx = TX - tx; ty = TY - ty; }
    return [tx * scale, (TY - ty) * scale];
  }

  function layout() {
    var wrap = document.getElementById("boardwrap");
    var availH = Math.max(320, window.innerHeight - 190);
    var availW = Math.max(240, wrap.clientWidth - 4);
    scale = Math.max(8, Math.floor(Math.min(availW / TX, availH / TY)));
    var dpr = window.devicePixelRatio || 1;
    cv.style.width = TX * scale + "px"; cv.style.height = TY * scale + "px";
    cv.width = Math.round(TX * scale * dpr); cv.height = Math.round(TY * scale * dpr);
    draw();
  }

  function drawDeploys() {
    var now = tick(cur), window_ = Math.max(1, Math.round(1000 / TICK_MS));
    D.deploys.forEach(function (d) {
      if (d.tick > now || now - d.tick > window_) return;
      var p = px(d.x, d.y), ok = d.status === 0, fade = 1 - (now - d.tick) / (window_ + 1);
      ctx.save(); ctx.globalAlpha = Math.max(0.15, fade);
      ctx.strokeStyle = ok ? TEAM[d.team] : "#555"; ctx.lineWidth = 2;
      if (!ok) ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.arc(p[0], p[1], scale * 0.6, 0, 2 * Math.PI); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = ok ? TEAM_DARK[d.team] : "#333"; ctx.font = "600 11px system-ui";
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      var text = cardName(d.card) + (ok ? "" : " x " + (D.statuses[d.status] || d.status));
      ctx.fillText(text, p[0], p[1] + scale * 0.65);
      ctx.restore();
    });
  }

  function side(team, f) {
    var el = document.getElementById("side" + team);
    var elixir = f[FF.elixir_milli][team], crowns = f[FF.crowns][team];
    var towers = { 0: "-", 1: "-", 2: "-" };
    f[FF.entities].forEach(function (r) {
      if (r[EF.team] === team && r[EF.tower_slot] >= 0) towers[r[EF.tower_slot]] = r[EF.hp];
    });
    var hand = f[FF.hands][team].map(function (c) {
      var card = cardById.get(c);
      return '<div class="card">' + (card ? esc(card.name) + "<b>" + card.elixir + "</b>" :
        "(empty)") + "</div>";
    }).join("");
    el.innerHTML = "<h2><span>" + NAMES[team] + "</span><span>" + "&#9819;".repeat(crowns) +
      "<small> " + crowns + "</small></span></h2>" +
      '<div class="kv"><span>elixir</span><span>' + (elixir / 1000).toFixed(2) + "</span></div>" +
      '<div class="bar"><div style="width:' + Math.min(100, elixir / 100) + '%"></div></div>' +
      '<div class="hand">' + hand + "</div>" +
      '<div class="kv" style="margin-top:8px"><span>king</span><span>' + towers[0] +
      "</span></div>" +
      '<div class="kv"><span>own-left princess</span><span>' + towers[1] + "</span></div>" +
      '<div class="kv"><span>own-right princess</span><span>' + towers[2] + "</span></div>";
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
    });
  }

  var decisions = D.agent_decisions || [], decisionIndex = -2;
  var decisionBody = document.getElementById("decision-body");
  document.getElementById("decisions-note").textContent = D.decisions_note ||
    "No synchronized agent decisions were recorded for this replay.";
  function decisionHTML(d) {
    var team = d.team === 0 ? "Blue" : "Red";
    return '<h3 class="' + team.toLowerCase() + '">' + esc(d.label || team) + ' &middot; ' +
      fmtTime(d.tick) + ' &middot; tick ' + d.tick + '</h3>' + d.steps.map(function (s) {
        var body = '<pre>' + esc(s.text) + '</pre>';
        return '<div class="decision-step">' + (s.kind === "thinking" ?
          '<details><summary>Recorded reasoning</summary>' + body + '</details>' :
          '<span class="kind">' + esc(s.title) + '</span>' + body) + '</div>';
      }).join("");
  }
  function showDecisions(atTick) {
    var lo = 0, hi = decisions.length;
    while (lo < hi) {
      var mid = (lo + hi) >>> 1;
      if (decisions[mid].tick <= atTick) lo = mid + 1; else hi = mid;
    }
    var index = lo - 1;
    if (index === decisionIndex) return;
    decisionIndex = index;
    if (index < 0) {
      decisionBody.innerHTML = '<p class="note">' + (decisions.length ?
        "The first recorded decision appears when playback reaches it." : "No decision text is available.") + '</p>';
      return;
    }
    var start = index;
    while (start > 0 && decisions[start - 1].tick === decisions[index].tick) start--;
    decisionBody.innerHTML = '<p class="decision-count">Decision ' + (index + 1) + ' of ' + decisions.length + '</p>' +
      decisions.slice(start, index + 1).map(decisionHTML).join('<hr>') + (start ?
        '<details class="decision-history"><summary>Earlier decisions (' + start + ')</summary>' +
        decisions.slice(0, start).reverse().map(function (d) { return '<article>' + decisionHTML(d) + '</article>'; }).join("") +
        '</details>' : "");
    decisionBody.scrollTop = 0;
  }

  function draw() {
    var next = interpBox.checked ? Math.min(cur + 1, N - 1) : cur;
    // Feed recorded transitions through the same animation state as the live stream.
    // Rebuild on backward seeks so spawn, damage, and spell origins don't depend on playback history.
    if (next < observed) { renderer.reset(); observed = -1; }
    while (observed < next) {
      observed++;
      renderer.observe(snapshot(observed), tick(observed) * TICK_MS);
    }
    var a = snapshot(cur), b = snapshot(next);
    var alpha = next === cur ? 0 : Math.max(0, Math.min(1, (simTick - a.k) / (b.k - a.k || 1)));
    var now = (next === cur ? a.k : a.k + (b.k - a.k) * alpha) * TICK_MS;
    var rawEntities = new Map(FR[next][FF.entities].map(function (r) { return [r[EF.uid], r]; }));
    var rawSpells = FF.spells === undefined ? [] : FR[next][FF.spells] || [];
    drawn = renderer.draw(a, b, alpha, now, {scale: scale, flip: flipBox.checked, cards: cards}).map(function (hit) {
      return {p: hit.p, rad: hit.rad, r: hit.entity && rawEntities.get(hit.entity[0]),
        spell: hit.spell && rawSpells[b.sp.indexOf(hit.spell)]};
    });
    var f = FR[cur];
    drawDeploys();
    side(0, f); side(1, f);
    showDecisions(now / TICK_MS);
    scrub.value = String(cur);
    document.getElementById("clock").textContent = "tick " + tick(cur) + "  " +
      fmtTime(tick(cur)) + "  (" + (cur + 1) + "/" + N + ")";
    playBtn.innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
    var res = document.getElementById("result");
    if (cur === N - 1 && D.result) {
      var w = D.result.winner, c = D.result.crowns;
      res.textContent = (w === 2 ? "Draw" : w === 0 ? "Blue wins" : w === 1 ? "Red wins" :
        "Episode cut before the game ended") + "  (crowns " + c[0] + " - " + c[1] +
        ")   final hash " + D.result.final_hash;
    } else {
      res.textContent = "state hash " + f[FF.state_hash];
    }
  }

  function seek(i) {
    renderer.reset(); observed = -1;
    cur = Math.max(0, Math.min(N - 1, i));
    simTick = tick(cur);
    draw();
  }

  function frameLoop(t) {
    if (playing && !scrubbing) {
      if (lastT !== null) {
        simTick += (t - lastT) * Number(speedSel.value) / TICK_MS;
        while (cur + 1 < N && tick(cur + 1) <= simTick) cur++;
        if (cur === N - 1) playing = false;
      }
      lastT = t;
      draw();
    } else {
      lastT = null;
    }
    window.requestAnimationFrame(frameLoop);
  }

  function toggle() {
    if (!playing && cur === N - 1) seek(0);
    playing = !playing;
    draw();
  }

  playBtn.addEventListener("click", toggle);
  document.getElementById("prev").addEventListener("click", function () {
    playing = false; seek(cur - 1);
  });
  document.getElementById("next").addEventListener("click", function () {
    playing = false; seek(cur + 1);
  });
  var scrubbing = false;
  scrub.addEventListener("pointerdown", function () { scrubbing = true; });
  window.addEventListener("pointerup", function () { scrubbing = false; });
  window.addEventListener("pointercancel", function () { scrubbing = false; });
  function onScrub() { seek(Number(scrub.value)); }
  scrub.addEventListener("input", onScrub);
  scrub.addEventListener("change", onScrub);
  flipBox.addEventListener("change", draw);
  interpBox.addEventListener("change", draw);
  window.addEventListener("resize", layout);
  window.addEventListener("keydown", function (e) {
    // A focused control already handles these keys natively (Space clicks a button,
    // arrows move the slider); handling them here too would act twice.
    var tag = e.target && e.target.tagName;
    if (tag === "BUTTON" || tag === "INPUT" || tag === "SELECT" || tag === "SUMMARY") return;
    // e.key first: synthetic and some platform events leave e.code empty.
    var k = e.key || e.code;
    if (k === " " || k === "Spacebar" || k === "Space") { e.preventDefault(); toggle(); }
    else if (k === "ArrowLeft") { playing = false; seek(cur - 1); }
    else if (k === "ArrowRight") { playing = false; seek(cur + 1); }
    else if (k === "Home") { playing = false; seek(0); }
    else if (k === "End") { playing = false; seek(N - 1); }
  });
  cv.addEventListener("mousemove", function (e) {
    var b = cv.getBoundingClientRect(), mx = e.clientX - b.left, my = e.clientY - b.top;
    var hit = null;
    for (var i = drawn.length - 1; i >= 0; i--) {
      var d = drawn[i], dx = mx - d.p[0], dy = my - d.p[1];
      if (dx * dx + dy * dy <= Math.max(d.rad, 6) * Math.max(d.rad, 6)) { hit = d; break; }
    }
    if (!hit) { tip.style.display = "none"; return; }
    if (hit.spell) {
      var q = hit.spell, mname = Object.keys(MOTION).filter(function (k) {
        return MOTION[k] === q[SF.motion];
      })[0];
      var mtext = mname === undefined ? "motion " + q[SF.motion] : mname.toLowerCase();
      tip.textContent = cardName(q[SF.card_id]) + "  (" + NAMES[q[SF.team]] + " spell, " +
        mtext + ")\ntile (" + (q[SF.x] / S).toFixed(2) + ", " +
        (q[SF.y] / S).toFixed(2) + ")\naim (" + (q[SF.aim_x] / S).toFixed(2) + ", " +
        (q[SF.aim_y] / S).toFixed(2) + ")" +
        (SF.delay_ticks !== undefined && q[SF.delay_ticks] > 0 ?
          "\ndelay " + q[SF.delay_ticks] + " ticks" : "") +
        (SF.length !== undefined && q[SF.length] > 0 ? "\nrolled " +
          (q[SF.travelled] / S).toFixed(2) + " / " + (q[SF.length] / S).toFixed(2) +
          " tiles, " + q[SF.hits] + " hit" : "");
      tip.style.display = "block";
      tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 10) + "px";
      return;
    }
    hit = hit.r;
    var kindName = Object.keys(KIND).filter(function (k) { return KIND[k] === hit[EF.kind]; })[0];
    tip.textContent = (cardName(hit[EF.card_id]) || kindName) + "  (" + NAMES[hit[EF.team]] +
      ", uid " + hit[EF.uid] + ")\nhp " + hit[EF.hp] + " / " + hit[EF.max_hp] +
      (EF.shield !== undefined && hit[EF.shield] > 0 ? "\nshield " + hit[EF.shield] : "") +
      "\ntile (" + (hit[EF.x] / S).toFixed(2) + ", " + (hit[EF.y] / S).toFixed(2) + ")" +
      "\nradius " + (hit[EF.radius] / S).toFixed(3) + " tiles" +
      (hit[EF.flying] ? "\nflying" : "") +
      (hit[EF.deploy_ticks] > 0 ? "\ndeploying: " + hit[EF.deploy_ticks] + " ticks left" : "") +
      (EF.stun_ticks !== undefined && hit[EF.stun_ticks] > 0 ?
        "\nstunned: " + hit[EF.stun_ticks] + " ticks left" : "") +
      (EF.knockback_ticks !== undefined && hit[EF.knockback_ticks] > 0 ?
        "\nknockback: " + hit[EF.knockback_ticks] + " ticks left" : "");
    tip.style.display = "block";
    tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 10) + "px";
  });
  cv.addEventListener("mouseleave", function () { tip.style.display = "none"; });

  var src = D.source;
  document.getElementById("meta").textContent = "seed " + src.seed + " | " + N + " frames" +
    (src.stride > 1 ? " (every " + src.stride + " of " + src.frames_recorded + ")" : "") +
    " | " + (src.frame_every_tick ? "every tick" : "one frame per decision") +
    " | tick " + TICK_MS + " ms | " + D.deploys.length + " deploy commands";
  if (D.warnings.length) {
    var warn = document.getElementById("warn");
    warn.style.display = "block";
    warn.textContent = "Warning: " + D.warnings.join(" | ");
  }
  document.getElementById("foot").textContent = "trace " + src.trace_format + " v" +
    src.trace_version + " | arena vintage: " + src.arena_vintage +
    " | positions are recorded engine state; interpolation, when on, is a straight-line guess" +
    " | Clash Royale data is evidence, not spec";
  layout();
  window.requestAnimationFrame(frameLoop);
})();
</script>
</body>
